# gitleaks config: secrets (default rules) plus personal data and LAN detail.
# Runs in the husky pre-commit hook (staged changes, if gitleaks is installed)
# and in CI (whole working tree). See CONTRIBUTING.md.

[extend]
useDefault = true

[[rules]]
id = "au-mobile-number"
description = "Australian mobile number (personal data)"
regex = '''(?:\+61[ -]?|\b0)4\d{2}[ -]?\d{3}[ -]?\d{3}\b'''
keywords = ["04", "+61"]

[[rules]]
id = "email-in-data-file"
description = "Email address in a data or fixture file (personal data)"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
path = '''(?i)(\.(json|csv|tsv|xlsx?|ya?ml)$|(^|/)(public|fixtures?|seed|data)/)'''
keywords = ["@"]

[[rules]]
id = "private-lan-address"
description = "Private LAN IPv4 address (station network detail)"
regex = '''\b(?:10\.\d{1,3}|192\.168|172\.(?:1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'''
keywords = ["10.", "192.168", "172."]

[allowlist]
description = "Known public or placeholder values"
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)skills-lock\.json$''',
  '''(^|/)LICENSE$''',
  # private working docs: a separate private repo cloned into docs/ (gitignored)
  '''^docs/''',
]
regexes = [
  # hCaptcha site keys are public by design
  '''3130983c-4200-4120-98ae-46fe42be99f0''',
  # test fixtures and placeholders
  '''test-secret-0123456789abcdef0123456789abcdef''',
  '''invalid-key-12345''',
  '''\$\{API_KEY\}''',
  '''04(12 345 678|23 456 789|34 567 890|45 678 901)''',
  '''@(example\.(com|org|net)|dev\.local|test\.com|users\.noreply\.github\.com)''',
]
