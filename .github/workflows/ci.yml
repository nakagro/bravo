name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Oxlint via Vite+)
        run: npx vp lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vp test run

      # Catches breakage that lint/typecheck/test miss: a bad import, a PWA or
      # bundler failure, anything that only shows up in a production build.
      #
      # Needs no secrets and no env file. `--mode vps` wants .env.vps, which is
      # gitignored and therefore absent here - Vite finds no mode file and every
      # VITE_* is simply undefined. That is the exact condition Vercel builds
      # under (it takes VITE_* from its dashboard instead), so this validates
      # the build the way production actually performs it.
      #
      # Deliberately NOT running Convex codegen: it downloads deployment state
      # over the network and so would need a CONVEX_DEPLOY_KEY secret. Schema
      # drift is caught by `npm run deploy:convex:uat` in the promotion
      # workflow, against real data - a better check than codegen gives.
      - name: Production build
        run: npx vp build --mode vps
