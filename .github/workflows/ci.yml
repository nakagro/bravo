name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Oxlint via Vite+)
        run: npx vp lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vp test run

      # Catches breakage that lint/typecheck/test miss: a bad import, a PWA or
      # bundler failure, anything that only shows up in a production build.
      #
      # Needs no secrets and no env file. `--mode vps` wants .env.vps, which is
      # gitignored and therefore absent here - Vite finds no mode file and every
      # VITE_* is simply undefined. That is the exact condition Vercel builds
      # under (it takes VITE_* from its dashboard instead), so this validates
      # the build the way production actually performs it.
      #
      # Deliberately NOT running Convex codegen: it downloads deployment state
      # over the network and so would need a CONVEX_DEPLOY_KEY secret. Schema
      # drift is caught by `npm run deploy:convex:uat` in the promotion
      # workflow, against real data - a better check than codegen gives.
      - name: Production build
        run: npx vp build --mode vps

  # Secrets and personal data. Scans the checked-out tree rather than history,
  # so it judges what a change leaves in the repo. Rules: .gitleaks.toml.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: Scan for secrets and personal data
        run: "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --verbose
