name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Oxlint via Vite+)
        run: npx vp lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vp test run
